services:
  # Backend NestJS
  backend:
    build: ./backend
    container_name: cine-backend
    ports:
      - "3000:3000"
    volumes:
      - ./cache:/app/cache
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  # Frontend Vue.js (avec proxy vers backend)
  frontend:
    build: ./frontend
    container_name: cine-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Service de développement
  dev-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: cine-dev-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./cache:/app/cache
    command: npm run dev
    profiles:
      - dev

  dev-frontend:
    image: node:20-alpine
    container_name: cine-dev-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_URL=http://localhost:3000/api
    profiles:
      - dev
